name: Import Profeco catalog

on:
  workflow_dispatch:
    inputs:
      term_limit:
        description: Broad search terms to query
        required: true
        default: "50"
      max_listings:
        description: Maximum unique latest listings to save
        required: true
        default: "5000"

concurrency:
  group: import-profeco-catalog
  cancel-in-progress: false

jobs:
  import-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate project
        run: npm run build

      - name: Import broad Profeco catalog
        run: npm run import:profeco-catalog
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NODE_ENV: production
          PROFECO_CITY_CODE: "0901"
          PROFECO_BULK_TERM_LIMIT: ${{ inputs.term_limit }}
          PROFECO_BULK_MAX_LISTINGS: ${{ inputs.max_listings }}
          PROFECO_REQUEST_DELAY_MS: "1000"
