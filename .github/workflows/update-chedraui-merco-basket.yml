name: Update Chedraui-Merco basket

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: online-grocery-refresh
  cancel-in-progress: false

jobs:
  update-basket:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/flutter_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate database secret
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          python3 - <<'PY'
          import ipaddress
          import os
          import sys
          from urllib.parse import unquote, urlsplit

          message = ('::error::Configure SUPABASE_DB_URL with the complete Supabase '
                     'Session pooler PostgreSQL URI, including username, password, '
                     'remote host, and database. Do not paste only a password or a psql command.')
          raw = os.environ.get('SUPABASE_DB_URL', '')
          try:
              url = urlsplit(raw)
              host = (url.hostname or '').lower().rstrip('.')
              valid = (raw == raw.strip() and not any(c.isspace() for c in raw)
                       and url.scheme in ('postgres', 'postgresql')
                       and host and url.username and url.password
                       and url.path.lstrip('/') and not url.fragment)
              valid = valid and host != 'localhost' and not host.endswith('.localhost')
              valid = valid and not host.startswith('127.') and host != '0'
              try:
                  address = ipaddress.ip_address(host)
                  valid = valid and not (address.is_loopback or address.is_unspecified)
              except ValueError:
                  pass
              decoded = unquote(raw).lower()
              placeholders = ('[password]', '<password>', 'your-password', 'your_password',
                              'yourpassword', 'project-ref', 'project_ref', 'your-host',
                              'your_host', 'your-database', 'your_database')
              valid = valid and not any(value in decoded for value in placeholders)
              if url.port is not None:
                  valid = valid and 1 <= url.port <= 65535
          except ValueError:
              valid = False
          if not valid:
              sys.exit(message)
          print('Database secret format is valid.')
          PY

      - name: Set up Flutter and Dart
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.7"
          channel: stable
          cache: true

      - name: Install runtime dependencies
        run: |
          flutter pub get
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Capture, validate, and publish complete basket
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          python3 tools/ingestion/python/daily_basket_update.py \
            --manifest tools/ingestion/catalogs/chedraui_merco_basket.json \
            --work-dir "$RUNNER_TEMP/tiago-basket-daily" \
            --publish

      - name: Summarize source and product status
        if: always()
        env:
          DAILY_REPORT: ${{ runner.temp }}/tiago-basket-daily/daily-report.json
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          from pathlib import Path
          path = Path(os.environ['DAILY_REPORT'])
          print('## Chedraui–Merco daily update')
          if not path.exists():
              print('\nNo daily report was produced. Review the workflow logs.')
              raise SystemExit(0)
          report = json.loads(path.read_text())
          print(f"\nStatus: **{report['status']}**. Published: **{report['published']}**.")
          print('\n| Source | Exit code |')
          print('|---|---:|')
          for source, details in report['sources'].items():
              print(f"| {source} | {details['exit_code']} |")
          print('\n| Product | Source | Status | Reasons |')
          print('|---|---|---|---|')
          for item in report['products']:
              reasons = ', '.join(item['reasons']) or '—'
              print(f"| {item['label']} | {item['source']} | {item['status']} | {reasons} |")
          PY

      - name: Upload capture and review report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: chedraui-merco-daily-${{ github.run_id }}
          path: ${{ runner.temp }}/tiago-basket-daily
          if-no-files-found: warn
          retention-days: 30
