name: Refresh online grocery prices

on:
  schedule:
    # 07:17 and 19:17 in Argentina; UTC schedules may start with a delay.
    - cron: "17 10,22 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: Registered source to refresh (all runs every source)
        type: choice
        default: all
        options:
          - all
          - smart-final-public-web
          - merco-mx
          - compro-super-mx
          - fenix-mx
          - garis-mx
          - merkabastos-mx
          - superissste-mx
          - mas-bodega-mx
          - carnemart-mx
          - chedraui-mx
          - gran-bodega-mx
          - justo-mx
          - scorpion-mx
          - merco-rosita-mx

permissions:
  contents: read

concurrency:
  group: online-grocery-refresh
  cancel-in-progress: false

jobs:
  sources:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.sources.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - name: Check shared database and public catalog configuration
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes postgresql-client
          fi
          python3 apps/flutter_app/tools/ingestion/python/scheduled_source_refresh.py \
            --check-config --work-dir "$RUNNER_TEMP/catalog-preflight"
      - id: sources
        env:
          SELECTED_SOURCE: ${{ inputs.source || 'all' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys
          sys.path.insert(0, 'apps/flutter_app/tools/ingestion/python')
          from expand_grocery_sources import SOURCES
          selected = os.environ['SELECTED_SOURCE']
          ordered = ['smart-final-public-web', 'merco-mx', 'compro-super-mx']
          ordered += [s for s in SOURCES if s not in ordered]
          if selected != 'all' and selected not in SOURCES:
              raise SystemExit('Unknown source')
          print('matrix=' + json.dumps({'source': ordered if selected == 'all' else [selected]}))
          PY

  refresh:
    needs: sources
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.sources.outputs.matrix) }}
    name: Refresh ${{ matrix.source }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: apps/flutter_app
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.7"
          channel: stable
          cache: true
      - name: Install runtime dependencies
        run: |
          flutter pub get
          if ! command -v psql >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes postgresql-client
          fi
      - name: Capture, validate, publish and verify this store
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY }}
          SOURCE: ${{ matrix.source }}
        run: |
          test -n "$SUPABASE_DB_URL"
          python3 tools/ingestion/python/scheduled_source_refresh.py \
            --source "$SOURCE" \
            --work-dir "$RUNNER_TEMP/catalog-refresh/$SOURCE"
      - name: Summarize this source
        if: always()
        env:
          SOURCE: ${{ matrix.source }}
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          from pathlib import Path
          source = os.environ['SOURCE']
          path = Path(os.environ['RUNNER_TEMP']) / 'catalog-refresh' / source / 'report.json'
          print(f'## {source}')
          if not path.exists():
              print('No report produced. Check setup and secret configuration.')
              raise SystemExit(0)
          report = json.loads(path.read_text())
          print(f"Status: **{report['status']}**")
          for key in ('known', 'captured', 'accepted', 'held', 'inserted', 'not_refreshed', 'known_urls_not_seen'):
              print(f"- {key}: {report[key]}")
          print(f"- Known catalog checked: {report.get('known_catalog_complete', False)}")
          for stage, reasons in report.get('exclusion_counts', {}).items():
              for reason, count in reasons.items():
                  print(f'- Excluded ({stage}): {reason}: {count}')
          print(f"- Public search counts: {report.get('public_search_counts', {})}")
          for error in report['errors']:
              print(f'- Error: {error}')
          for diagnostic in report.get('diagnostics', []):
              print(f'- Diagnostic: {diagnostic}')
          PY
      - name: Upload counts and verification summary only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-refresh-${{ matrix.source }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/catalog-refresh/${{ matrix.source }}/report.json
          if-no-files-found: warn
          retention-days: 14
