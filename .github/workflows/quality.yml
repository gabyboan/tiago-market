name: Quality and secrets

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog:
    name: Catalog SQL contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-fixture
          POSTGRES_DB: tiago_catalog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tiago_catalog_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: local-fixture
      PGDATABASE: tiago_catalog_test
    steps:
      - uses: actions/checkout@v6
      - name: Compare catalog RPC results and permissions
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes postgresql-client
          fi
          python3 scripts/check_catalog_rpc.py
          python3 scripts/check_catalog_storage.py
          python3 scripts/check_catalog_repetitions.py

  publication:
    name: Publication and secret checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify public file selection
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/check_publication.py
      - name: Install verified Gitleaks release
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl --fail --silent --show-error --location "$base/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" --output gitleaks.tar.gz
          curl --fail --silent --show-error --location "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" --output checksums.txt
          mv gitleaks.tar.gz "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          sha256sum --check --ignore-missing checksums.txt
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
      - name: Scan Git history
        run: '"$RUNNER_TEMP/gitleaks" git . --redact=100 --no-banner'

  node:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  flutter:
    name: Flutter and ingestion
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/flutter_app
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.7"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Test authentication with isolated fixtures
        run: >-
          flutter test test/auth_flow_session_test.dart
          --dart-define=SUPABASE_URL=https://test.supabase.co
          --dart-define=SUPABASE_PUBLISHABLE_KEY=test-public-key
      - run: python3 -m unittest discover -s tools -p 'test_release_config.py'
      - run: python3 -m unittest discover -s tools/ingestion/python -p 'test_*.py'

  web:
    name: Price web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/price_web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/price_web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
