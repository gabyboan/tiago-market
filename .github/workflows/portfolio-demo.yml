name: Publish portfolio demo

on:
  push:
    branches: [main]
    paths:
      - "apps/flutter_app/**"
      - ".github/workflows/portfolio-demo.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-demo
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.7"
          channel: stable
          cache: true
      - uses: actions/configure-pages@v5
      - run: flutter pub get
        working-directory: apps/flutter_app
      - name: Analyze and test the client
        working-directory: apps/flutter_app
        run: |
          flutter analyze
          flutter test
      - name: Build without production credentials
        run: python3 apps/flutter_app/tools/build_portfolio_demo.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/flutter_app/build/portfolio-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish demo
        id: deployment
        uses: actions/deploy-pages@v4
